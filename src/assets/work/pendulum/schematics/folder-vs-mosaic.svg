<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 84 1212 482" role="img" aria-labelledby="fm-t fm-d" class="dw">
<title id="fm-t">The same six files, in a folder and in Pendulum</title>
<desc id="fm-d">On the left, six files in a folder, sorted by name, each with a date: a brief, a corridor shoot, an essay, a lobby film, a photograph named peaks_012.jpg and a sound recording. The photograph the brief asks for sits fifth, outlined, under a name that says nothing about what it shows. On the right, the same six files in Pendulum, ordered by the question mountains at night, closest first: the photograph Peaks at night top left in lavender, both words matched, then the winter brief that asks for peaks at night, the mountain essay, the corridor shoot with the same night light, the recording from a mountain ridge, and the lobby film, furthest away. The question sits in the bar at the bottom, with mountains and night lit.</desc>
