<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 84 1252 452" role="img" aria-labelledby="fo-t fo-d" class="dw">
<title id="fo-t">The same six files, in a folder and as the ideas connect</title>
<desc id="fo-d">On the left, six files in a folder, sorted by name, each with a date: a brief, a corridor shoot, an essay, a lobby film, a photograph of peaks and a sound recording. On the right, the same six files joined by what links them: the brief asks for the peaks at night and keeps the essay’s tone, the peaks share their night light with the corridor shoot, the corridor shares its stone rooms with the lobby film, and the recording is the film’s soundtrack. One more link leaves the library, to a night series on the web.</desc>
