<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 116 1188 320" role="img" aria-labelledby="sc-t sc-d" class="dw">
<title id="sc-t">The six features on the team’s list, and what the demos tested</title>
<desc id="sc-d">Six features in three columns. Tested in the demos, on a lavender panel: one search for every kind of file, and a visual workspace that shows every file as a picture. Designed after the test: bringing files in from where they already live, tagging and sorting by itself, and working on it together with shared folders and replies. Left out, faint: exporting to design software such as Photoshop and Illustrator.</desc>
