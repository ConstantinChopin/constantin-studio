<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 34 1092 630" role="img" aria-labelledby="pr-t pr-d" class="dw">
<title id="pr-t">How a creative project uses its files</title>
<desc id="pr-d">Six steps of a creative project, in order: define the context and set expectations, which is when people gather what exists; ideate, resolve and deliver, when they make sense of it; and evolve, when they shape it and share it. Every step leaves files in the team’s library, and a line from the library runs back to every step, because any step can use them again.</desc>
