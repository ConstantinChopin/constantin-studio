<marker id="cu-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.2 1.4L8.8 5L1.2 8.6Z" fill="rgba(17,15,15,0.34)" stroke="rgba(17,15,15,0.34)" stroke-width="1" stroke-linejoin="round"/></marker><marker id="cu-arrow-gold" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.2 1.4L8.8 5L1.2 8.6Z" fill="rgb(143,119,54)" stroke="rgb(143,119,54)" stroke-width="1" stroke-linejoin="round"/></marker>
