<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 223 1140 332" role="img" aria-labelledby="cu-t cu-d" class="dw">
<title id="cu-t">2.3 million properties narrowed to about 3,000</title>
<desc id="cu-d">A supplier's list of 2.3 million properties is drawn as a band that passes through four filters in turn: rankings, reviews, destination and price. The band narrows at each one. About 3,000 hotels that advisors recognise come out, in gold. The widths are not to scale.</desc>
