<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 174 1090 376" role="img" aria-labelledby="bd-t bd-d" class="dw">
<title id="bd-t">The four steps of the build, each standing on the ones before</title>
<desc id="bd-d">Four stacks, left to right, in the order they were built. Step one, an agency's knowledge as checked records, is in gold. Step two, the client's profile and history read from the agency's booking system and completed by the advisor, sits on step one. Step three, the ideal trip drafted from the client's history with the best commission and extras, sits on steps one and two. Step four, booking, asked, held and confirmed from the trip, sits on all three.</desc>
