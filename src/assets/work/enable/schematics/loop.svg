<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 30 1140 624" role="img" aria-labelledby="lp-t lp-d" class="dw">
<title id="lp-t">How a week worked</title>
<desc id="lp-d">Three lanes: our design partner, me, and AI working inside the design system. Each week starts with a call with the design partner, twice a week. I decide, and write down the problem, the evidence and the option turned down. AI builds it in the working prototype, and checks run on the code, on every screen, and as a cold read of each screen. A check that fails goes back to the build. The advisors use the new version, and the loop comes back to the next call, every week, sometimes twice.</desc>
