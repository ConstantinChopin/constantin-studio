<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 188 1060 348" role="img" aria-labelledby="ly-t ly-d" class="dw">
<title id="ly-t">The three layers of a hotel record, and who sees each</title>
<desc id="ly-d">One hotel record has three layers: the advisor's notes on top, the agency's deals and commission in the middle, in gold because the agency has checked them, and public facts at the bottom. The advisor sees all three. A colleague at the same agency sees the deals and the public facts, and the notes only if the advisor shares them. Another agency sees only the public facts.</desc>
