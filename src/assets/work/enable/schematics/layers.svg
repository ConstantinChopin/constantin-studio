<filter id="ly-lift" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgb(24,18,12)" flood-opacity="0.06"/><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgb(24,18,12)" flood-opacity="0.06"/></filter>
<marker id="ly-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.2 1.4L8.8 5L1.2 8.6Z" fill="rgba(17,15,15,0.34)" stroke="rgba(17,15,15,0.34)" stroke-width="1" stroke-linejoin="round"/></marker><marker id="ly-arrow-gold" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.2 1.4L8.8 5L1.2 8.6Z" fill="rgb(143,119,54)" stroke="rgb(143,119,54)" stroke-width="1" stroke-linejoin="round"/></marker>
