<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 150 1100 370" role="img" aria-labelledby="cf-t cf-d" class="dw">
<title id="cf-t">Three sources disagreeing about one value</title>
<desc id="cf-d">Three sources give a different commission for the same hotel: the partner portal says 12%, the signed terms; the booking platform says 10%, an old rate; a manual entry says 14%, not confirmed. A selector that only the advisor moves rests on the partner portal, and 12% goes into the record's commission field, in gold. The other two are not used. The system never picks on its own.</desc>
<defs>
<filter id="cf-lift" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgb(24,18,12)" flood-opacity="0.06"/><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgb(24,18,12)" flood-opacity="0.06"/></filter>
<marker id="cf-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.2 1.4L8.8 5L1.2 8.6Z" fill="rgba(17,15,15,0.34)" stroke="rgba(17,15,15,0.34)" stroke-width="1" stroke-linejoin="round"/></marker><marker id="cf-arrow-gold" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.2 1.4L8.8 5L1.2 8.6Z" fill="rgb(143,119,54)" stroke="rgb(143,119,54)" stroke-width="1" stroke-linejoin="round"/></marker>
