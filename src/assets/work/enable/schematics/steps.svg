<svg xmlns="http://www.w3.org/2000/svg" viewBox="164 77 1002 550" role="img" aria-labelledby="st-t st-d" class="dw">
<title id="st-t">The eleven steps of a sale, and the five we focused on</title>
<desc id="st-d">Eleven steps in order, from the first lead to after the trip. The first five, from first contact to the proposal, sit together on a panel: this is where we focused. The six after are faint. Step five produces the proposal the client receives, a real one, shown as a card on the right.</desc>
