<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 140 1138 466" role="img" aria-labelledby="fd-t fd-d" class="dw">
<title id="fd-t">What goes in, and what reads from it</title>
<desc id="fd-d">Six systems, portal, booking, the itinerary builder, drive, email and CRM, feed one bus into the shared place inside Enable, which holds a checked record for each hotel, client and trip. Every screen, the hotel records, the briefing, ask, itinerary and client profile, reads from that same place.</desc>
