<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="cf-t cf-d" class="dw">
<title id="cf-t">Three sources disagreeing about one value</title>
<desc id="cf-d">Three sources give a different commission for the same hotel: the booking platform says 10%, an old rate; the partner portal says 12%, the signed terms; a manual entry says 14%, not confirmed. The advisor chooses 12%, which turns gold once confirmed. The other two are not used. The system never picks on its own.</desc>
